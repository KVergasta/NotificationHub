spring.application.name=NotificationServ
server.port=${PORT:8000}

# PostgreSQL Database configuration
spring.datasource.driver-class-name=org.postgresql.Driver
# Explicação: Se houver as variáveis na nuvem (Render), o Spring usa. Se não houver, ele usa o seu localhost:5433 padrão para rodar na sua máquina.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/notificationhub}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update

# SQL Logs
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always

# Credenciais GMAIL
app.mail.gmail.host=smtp.gmail.com
app.mail.gmail.username=notificationhubservice@gmail.com
app.mail.gmail.password=rdgtashsijvdcxpj

# Credenciais OUTLOOK
app.mail.outlook.host=smtp.outlook.com
app.mail.outlook.username=notif.hub@outlook.com
app.mail.outlook.password=wkvxlvepqyazldpn

# Kafka Configuração para Nuvem e Local
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=notification-group-v2

# Configurações de Segurança do Kafka (Exigidas pelo Upstash na nuvem, ignoradas no localhost)
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:PLAIN}
spring.kafka.properties.sasl.jaas.config=${KAFKA_JAAS_CONFIG:}

spring.kafka.admin.fail-fast=false
spring.kafka.listener.missing-topics-fatal=false

# Caminho do Firebase (Ajustado para bater com as validações de ambiente do Java)
app.firebase.config-path=${FIREBASE_CONFIG_PATH:/etc/secrets/notificationhub-d9fb5-firebase-adminsdk-fbsvc-95711e229d.json}